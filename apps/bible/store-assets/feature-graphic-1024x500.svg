<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500"><title>하루말씀 소개 그래픽</title><desc>크림색 바탕, 초록 글씨와 원본 책 모티프. 앱 화면을 모사하지 않은 소개 그림.</desc><rect width="1024" height="500" fill="#FFF9EE"/><circle cx="855" cy="224" r="155" fill="#E8EDDC"/><path d="M698 406 Q854 438 962 384" fill="none" stroke="#D2DEC8" stroke-width="3"/><g font-family="Malgun Gothic,sans-serif" fill="#305D50"><text x="72" y="72" font-size="18" letter-spacing="1">하루 한 구절, 마음에 머무는 시간</text><text x="68" y="162" font-size="72" font-weight="700" letter-spacing="-2">하루말씀</text><text x="72" y="241" font-size="36" font-weight="700">큰 글씨로 읽고,</text><text x="72" y="297" font-size="36" font-weight="700">소리로 듣고,</text><text x="72" y="353" font-size="36" font-weight="700">카드로 나눠요</text><text x="72" y="439" font-size="20" fill="#5B7061">30개 구절을 하루 하나씩 순환합니다</text></g><g transform="translate(646 44) scale(7)"><path fill="#305D50" d="M8,12q8,-4 16,1q8,-5 16,-1v25q-8,-4 -16,1q-8,-5 -16,-1z"/><path fill="none" stroke="#FFF9EE" stroke-width="1.7" d="M24,14v21M12,19h8M28,19h8M12,24h8M28,24h8M12,29h8M28,29h8"/></g></svg>