services:
  barolab-dashboard:
    image: barolab-dashboard:local
    container_name: barolab-dashboard
    restart: unless-stopped
    ports:
      - "8790:8790"
    environment:
      TZ: Asia/Seoul
      BAROLAB_ALLOWED_HOSTS: "192.168.45.190,otns,otns.local,localhost,127.0.0.1,::1"
      BAROLAB_TRUSTED_CLIENTS: "127.0.0.0/8,::1/128,192.168.45.0/24,172.30.1.0/24,172.18.0.1/32"
      BAROLAB_CONFIG_KEY_FILE: /run/secrets/barolab_config_key
      BAROLAB_CDP_HOST: "192.168.45.248"
    secrets:
      - barolab_config_key
    volumes:
      - "${BAROLAB_ROOT:-/volume1/yoonlab/10_Project/BaroLab}/dashboard:/app/dashboard:ro"
      - "${BAROLAB_ROOT:-/volume1/yoonlab/10_Project/BaroLab}/apps/bible/project.json:/app/apps/bible/project.json:ro"
      - "${BAROLAB_ROOT:-/volume1/yoonlab/10_Project/BaroLab}/apps/shopping/project.json:/app/apps/shopping/project.json:ro"
      - "${BAROLAB_ROOT:-/volume1/yoonlab/10_Project/BaroLab}/apps/magnifier/project.json:/app/apps/magnifier/project.json:ro"
      - "${BAROLAB_ROOT:-/volume1/yoonlab/10_Project/BaroLab}/apps/greeting/project.json:/app/apps/greeting/project.json:ro"
      - "${BAROLAB_ROOT:-/volume1/yoonlab/10_Project/BaroLab}/cf_posting/data:/app/cf_posting/data:ro"
      - "${BAROLAB_ROOT:-/volume1/yoonlab/10_Project/BaroLab}/cf_posting/output:/app/cf_posting/output:ro"
      - "${BAROLAB_ROOT:-/volume1/yoonlab/10_Project/BaroLab}/naver_blog_posting/data:/app/naver_blog_posting/data:ro"
      - "${BAROLAB_ROOT:-/volume1/yoonlab/10_Project/BaroLab}/naver_blog_posting/output:/app/naver_blog_posting/output:ro"
      - "${BAROLAB_ROOT:-/volume1/yoonlab/10_Project/BaroLab}/server/data:/app/server/data"
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

secrets:
  barolab_config_key:
    file: ./server/data-secret/llm-settings.key
